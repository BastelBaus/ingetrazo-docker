# Build both images (engine, viewer) and run the end-to-end smoke test
# (MCP, viewer with its own IngeTrazo, and viewer image + render engine).
# "upstream" builds the engine from IngeTrazo's newest release instead of
# the fork: informational, it shows when the container can switch
# (ingelibre/ingetrazo#1717).
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:          # release.yml runs it on main and tags, before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck entrypoint.sh tests/smoke.sh

      - name: Unit tests (model folders, render queue, viewer pages)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - uses: docker/setup-buildx-action@v4

      - name: Build engine image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: engine
          load: true
          tags: ingetrazo-docker:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Build viewer image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: viewer
          load: true
          tags: ingetrazo-viewer:ci
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=viewer-amd64
          cache-to: type=gha,scope=viewer-amd64,mode=max

      - name: Smoke test
        env:
          IMAGE: ingetrazo-docker:ci
          VIEWER_IMAGE: ingetrazo-viewer:ci
        run: tests/smoke.sh

      - name: Validate compose file
        env:
          MCP_TOKEN: ci-dummy-token-0123456789
        run: |
          docker compose --profile viewer config -q
          docker compose -f compose.yaml -f compose.folders.example.yaml --profile viewer config -q

  # The same engine and smoke test on IngeTrazo's newest upstream release.
  # Not required: it fails while the fork has tools upstream lacks.
  upstream:
    name: upstream (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Newest upstream release
        id: up
        run: |
          set -euo pipefail
          tag=$(git ls-remote --tags --refs https://github.com/ingelibre/ingetrazo 'v*' \
                | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Upstream IngeTrazo $tag" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - name: Build engine image on upstream
        uses: docker/build-push-action@v7
        with:
          context: .
          target: engine
          load: true
          tags: ingetrazo-docker:upstream
          build-args: |
            INGETRAZO_REPO=https://github.com/ingelibre/ingetrazo
            INGETRAZO_REF=${{ steps.up.outputs.tag }}
          cache-from: type=gha,scope=amd64

      - name: Build viewer image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: viewer
          load: true
          tags: ingetrazo-viewer:upstream
          cache-from: type=gha,scope=viewer-amd64

      - name: Smoke test
        env:
          IMAGE: ingetrazo-docker:upstream
          VIEWER_IMAGE: ingetrazo-viewer:upstream
        run: tests/smoke.sh
