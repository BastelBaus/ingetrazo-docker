# Build the engine image and run the end-to-end smoke test (an engine in
# each mode). ingetrazo-web-viewer tests its services against :dev.
# "upstream" builds the engine from IngeTrazo's newest release instead of
# the fork: informational, it shows when the container can switch
# (ingelibre/ingetrazo#1717).
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:          # release.yml runs it on main and tags, before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck entrypoint.sh tests/smoke.sh

      - name: Unit tests (model folders, engine API)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - uses: docker/setup-buildx-action@v4

      - name: Build engine image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ingetrazo-docker:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Smoke test
        env:
          IMAGE: ingetrazo-docker:ci
        run: tests/smoke.sh


  # IngeTrazo's newest upstream release instead of the fork: does it have
  # what the container needs (tests/upstream_ready.py)? Green with a warning
  # while it does not; once it does, the full smoke test runs on it too.
  upstream:
    name: upstream (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Newest upstream release
        id: up
        run: |
          set -euo pipefail
          tag=$(git ls-remote --tags --refs https://github.com/ingelibre/ingetrazo 'v*' \
                | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build engine image on upstream
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ingetrazo-docker:upstream
          build-args: |
            INGETRAZO_REPO=https://github.com/ingelibre/ingetrazo
            INGETRAZO_REF=${{ steps.up.outputs.tag }}
          cache-from: type=gha,scope=amd64

      - name: Ready to switch?
        id: ready
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set +e -uo pipefail   # a NOT READY exit code is reported, not fatal
          out=$(docker run --rm -v "$PWD/tests:/tests:ro" --entrypoint python \
                ingetrazo-docker:upstream /tests/upstream_ready.py /opt/ingetrazo)
          code=$?
          echo "$out"
          { echo "### Upstream IngeTrazo $TAG"; echo; echo "$out"; } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Upstream not ready::IngeTrazo $TAG lacks what the container needs (ingelibre/ingetrazo#1717); smoke test skipped"
          fi

      - name: Smoke test
        if: steps.ready.outputs.ready == 'true'
        env:
          IMAGE: ingetrazo-docker:upstream
        run: tests/smoke.sh
