# Publish the image to the GitHub Container Registry once the smoke test
# passed: on every push to main (tag `latest`) and on version tags v*.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name (registry names are lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ingetrazo" >> "$GITHUB_OUTPUT"

      - name: IngeTrazo ref baked into the image
        id: ref
        run: |
          echo "repo=$(sed -n 's/^ARG INGETRAZO_REPO=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "ref=$(sed -n 's/^ARG INGETRAZO_REF=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=IngeTrazo (headless)
            org.opencontainers.image.description=IngeTrazo headless: MCP over HTTP and a live sheet/view viewer
            org.opencontainers.image.licenses=GPL-3.0-or-later
            io.github.ingetrazo.repo=${{ steps.ref.outputs.repo }}
            io.github.ingetrazo.ref=${{ steps.ref.outputs.ref }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          provenance: true
          sbom: true
