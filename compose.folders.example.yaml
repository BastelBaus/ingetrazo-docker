# Several model folders: copy to compose.override.yaml (docker compose
# reads it next to compose.yaml) and adjust the host paths. Then name the
# same folders, with their mode and scan options, in .env:
#
#   MODEL_FOLDERS=projects:rw; archive:ro:depth=1:exclude=old*,*.bak.igz
#
# Each folder is mounted at /data/<name> in every service. The MCP service
# may write to the rw ones (mount the ro ones read-only too, as below); the
# viewer and its render engine mount every folder read-only, at the same
# paths (the viewer names the files the engine opens).
#
# /data itself becomes an empty volume (the entries with target /data
# replace compose.yaml's ./data mount): the folders are mounted inside it,
# which a read-only /data would not allow. To keep ./data as one of the
# folders, mount it as one, e.g. ./data:/data/data and MODEL_FOLDERS=data:rw;…

services:
  mcp:
    volumes:
      - model-folders:/data
      - /srv/models/projects:/data/projects
      - /srv/models/archive:/data/archive:ro

  viewer:
    volumes:
      - model-folders:/data
      - /srv/models/projects:/data/projects:ro
      - /srv/models/archive:/data/archive:ro

  viewer-engine:
    volumes:
      - model-folders:/data
      - /srv/models/projects:/data/projects:ro
      - /srv/models/archive:/data/archive:ro

volumes:
  model-folders:
